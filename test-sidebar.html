<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificación Visual del Menú IA Polledo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px;
      background: #eef3f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .preview-header {
      margin-bottom: 24px;
    }
    .preview-header h1 {
      margin: 0 0 6px;
      color: #073B61;
      font-size: 24px;
      font-weight: 800;
    }
    .preview-header p {
      margin: 0;
      color: #557086;
      font-size: 14px;
    }
    .preview-row {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(7, 59, 97, 0.08);
      border: 1px solid #dce6ed;
    }
    .card-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #073B61;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e0f2f1;
      color: #00796b;
      font-size: 11px;
    }
    .sidebar-mock {
      position: relative !important;
      inset: auto !important;
      display: block !important;
      height: 480px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(4, 28, 48, 0.25);
    }
  </style>
</head>
<body>

  <div class="preview-header">
    <h1>Comprobación Visual: Encabezado Menú Lateral «IA Polledo»</h1>
    <p>Símbolo completo sin recortes + Nombre HTML real con Nunito 900 + Línea amarilla curva + Botón independiente</p>
  </div>

  <div class="preview-row">

    <!-- 1. Menú Expandido -->
    <div class="card">
      <div class="card-title">
        <span>Menú Lateral Expandido</span>
        <span class="card-badge">238 px (Escritorio / Celular)</span>
      </div>
      <aside class="sidebar sidebar-mock" style="width: 238px;">
        <div class="sidebar-brand brand">
          <a href="#dashboard" class="brand-identity" title="IA Polledo">
            <img src="logo-ia-polledo-symbol.png" alt="Símbolo IA Polledo" class="brand-symbol">
            <div class="brand-name-wrap">
              <span class="brand-name">IA Polledo</span>
              <svg class="brand-underline" viewBox="0 0 100 8" fill="none" preserveAspectRatio="none" aria-hidden="true">
                <path d="M 3 2 Q 50 8 97 2" stroke="#FEB706" stroke-width="3.2" stroke-linecap="round"/>
              </svg>
            </div>
          </a>
          <button id="sidebarCollapse" class="sidebar-collapse" type="button" aria-label="Contraer menú">‹</button>
        </div>
        <nav class="nav">
          <button class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Inicio</span>
          </button>
          <details class="nav-group" open>
            <summary>
              <svg class="nav-icon icon-teal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-5-8"/><path d="M16 3.13a5 5 0 0 1 0 7.75"/></svg>
              <span>Alumnos</span>
            </summary>
            <div>
              <button class="nav-item">
                <svg class="nav-sub-icon icon-teal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
                <span>Lista de alumnos</span>
              </button>
            </div>
          </details>
          <details class="nav-group">
            <summary>
              <svg class="nav-icon icon-coral" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <span>Trabajo académico</span>
            </summary>
          </details>
        </nav>
      </aside>
    </div>

    <!-- 2. Menú Contraído -->
    <div class="card">
      <div class="card-title">
        <span>Menú Contraído</span>
        <span class="card-badge">76 px</span>
      </div>
      <aside class="sidebar sidebar-mock collapsed" style="width: 76px;">
        <div class="sidebar-brand brand">
          <a href="#dashboard" class="brand-identity" title="IA Polledo">
            <img src="logo-ia-polledo-symbol.png" alt="Símbolo IA Polledo" class="brand-symbol">
            <div class="brand-name-wrap">
              <span class="brand-name">IA Polledo</span>
              <svg class="brand-underline" viewBox="0 0 100 8" fill="none" preserveAspectRatio="none" aria-hidden="true">
                <path d="M 3 2 Q 50 8 97 2" stroke="#FEB706" stroke-width="3.2" stroke-linecap="round"/>
              </svg>
            </div>
          </a>
          <button id="sidebarCollapse2" class="sidebar-collapse" type="button" aria-label="Contraer menú">‹</button>
        </div>
        <nav class="nav">
          <button class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Inicio</span>
          </button>
          <details class="nav-group">
            <summary>
              <svg class="nav-icon icon-teal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/></svg>
            </summary>
          </details>
        </nav>
      </aside>
    </div>

  </div>

</body>
</html>
